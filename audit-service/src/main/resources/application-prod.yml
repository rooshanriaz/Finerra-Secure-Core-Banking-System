spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:fyp_user}
    password: ${MYSQL_PASSWORD:fyp_password}
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

fabric:
  enabled: ${FABRIC_ENABLED:true}
  wallet-path: ${FABRIC_WALLET:/app/fabric-wallet}
  network-config: ${FABRIC_CONFIG:/app/fabric-network/connection-profile.yaml}

logging:
  level:
    com.fyp.audit: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
