server:
  port: 8081
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEYSTORE_PATH:}
    key-store-password: ${SERVER_SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
    trust-store: ${SERVER_SSL_TRUSTSTORE_PATH:}
    trust-store-password: ${SERVER_SSL_TRUSTSTORE_PASSWORD:}
    client-auth: ${SERVER_SSL_CLIENT_AUTH:none}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/cbc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:fyp_user}
    password: ${DATABASE_PASSWORD:fyp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant-id: ${FINERACT_TENANT_ID:default}
  skip-ssl-verification: ${FINERACT_SKIP_SSL_VERIFICATION:true}
  mtls-enabled: ${FINERACT_MTLS_ENABLED:false}
  client-key-store-path: ${FINERACT_CLIENT_KEYSTORE_PATH:}
  client-key-store-password: ${FINERACT_CLIENT_KEYSTORE_PASSWORD:}
  trust-store-path: ${FINERACT_TRUST_STORE_PATH:}
  trust-store-password: ${FINERACT_TRUST_STORE_PASSWORD:}

logging:
  level:
    root: WARN
    com.fyp.cbc: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
