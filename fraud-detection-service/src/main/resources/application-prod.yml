spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fraud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:fyp_user}
    password: ${MYSQL_PASSWORD:fyp_password}
    hikari:
      pool-name: FraudServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecretKeyThatShouldBeChangedInProductionEnvironment123!}

ml-service:
  url: ${ML_SERVICE_URL:http://127.0.0.1:5000}
  timeout-ms: 5000
  connect-timeout-ms: 3000

logging:
  level:
    root: INFO
    com.fyp.fraud: INFO
  file:
    name: logs/fraud-detection-service.log

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
