# =============================================================================
# Auth Service - Production Infrastructure
# =============================================================================
# Usage:
#   docker-compose up -d              # Start MySQL and Redis
#   docker-compose down               # Stop all
#   docker-compose logs -f            # View logs
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # MySQL for Auth Service (port 3307 to avoid conflict with Fineract MySQL)
  # ===========================================================================
  auth-mysql:
    image: mysql:8.0
    container_name: auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: auth_db
    ports:
      - "3308:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  # ===========================================================================
  # Redis for Token Revocation
  # ===========================================================================
  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - auth_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

volumes:
  auth_mysql_data:
  auth_redis_data:

networks:
  auth-network:
    driver: bridge
